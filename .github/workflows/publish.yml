name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC), so this repository holds no
# PyPI token — there is no long-lived secret to leak or rotate. PyPI verifies
# the workflow's identity directly.
#
# One-time setup on PyPI, under Your projects → Publishing → Add a pending
# publisher:
#
#   PyPI project name : protocore
#   Owner             : anchor-inference
#   Repository name   : protocore
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# After that, publishing a GitHub Release uploads the matching version.
#
# One-time setup on GitHub, and it is not optional: Settings → Environments →
# `pypi` → Required reviewers. The environment is the only point in this
# workflow where an upload physically stops and waits for a person, and it is
# the only one a release event cannot walk around. Everything below narrows the
# ways in; the reviewer is what makes the last one deliberate.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        required: true
        default: testpypi
        type: choice
        # The real index is deliberately absent. Uploading to it by hand was a
        # second door into an irreversible action, opened without a release,
        # without a tag, and without the version check that reads one. A PyPI
        # version number can never be reused, so the door is closed rather than
        # guarded.
        options: [testpypi]

jobs:
  gates:
    name: Release gates
    # A dispatch to TestPyPI is a rehearsal against a throwaway index; it does
    # not need — and must not wait on — the gates that govern the real one.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      # "The tests were green" has to be a statement about THIS commit. The CI
      # workflow runs on the release event as well, so a run for this exact SHA
      # exists; requiring one is what turns the claim into a check.
      - name: Require a completed, successful test run for this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}" \
              --jq '[.workflow_runs[] | select(.status == "completed")] | first | .conclusion // "pending"')
            if [ "$state" = "success" ]; then
              echo "the test workflow concluded successfully for ${SHA}"
              exit 0
            fi
            if [ "$state" != "pending" ]; then
              echo "::error::the test workflow concluded '${state}' for ${SHA}"
              exit 1
            fi
            echo "waiting for the test workflow on ${SHA} (attempt ${attempt})"
            sleep 30
          done
          echo "::error::no completed test run for ${SHA} after 30 minutes"
          exit 1

      # The publication scan itself is not here and cannot be. It matches
      # against a list of the things that must never appear in this repository,
      # and that list describes them by name — so a scanner published here would
      # publish the very list it exists to enforce, and so would a repository
      # secret or variable holding it, which anyone able to add a workflow step
      # can print. The scan therefore runs outside this repository, from a
      # private checkout, against this repository's public HEAD, and reports its
      # verdict back as a commit status. This step reads the verdict; it never
      # sees the list.
      #
      # Contract with the external scanner:
      #   context     : publication/leak-scan
      #   target SHA  : the commit the release points at
      #   state       : success only when the scan found nothing
      #   description : a count, never a matched string
      - name: Require a clean publication scan for this commit
        run: |
          set -euo pipefail
          state=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
            --jq 'first(.statuses[] | select(.context == "publication/leak-scan") | .state) // "missing"')
          if [ "$state" != "success" ]; then
            echo "::error::publication scan status for ${SHA} is '${state}', expected 'success'."
            echo "Run the scan from the private checkout against this SHA and let it report."
            exit 1
          fi
          echo "publication scan is clean for ${SHA}"

  build:
    name: Build distributions
    needs: [gates]
    # `needs` on a skipped job skips this one too, and the gates job is skipped
    # on a TestPyPI rehearsal on purpose. `always()` plus an explicit reading of
    # the result keeps the rehearsal working while a failed or cancelled gate
    # still stops a real release.
    if: always() && (needs.gates.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata renders
        run: uvx twine check dist/*

      - name: Refuse to publish a version the tag does not name
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/protocore-(.*)\.tar\.gz|\1|')
          if [ "$tag" != "$built" ]; then
            echo "::error::release tag is '$tag' but the build produced '$built'."
            echo "PyPI never lets a version be re-used, so this stops here."
            exit 1
          fi
          echo "tag and built version agree: $built"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/protocore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Upload to PyPI
    # A published release, and nothing else. The manual route to this index no
    # longer exists as a form, so this condition has one branch rather than two.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/protocore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      # Skip a file already on the index instead of failing. The version
      # guard in the build job is what catches a genuine mistake; this only
      # keeps a re-run, or a release cut for a version published by hand,
      # from turning red over work that is already done.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
