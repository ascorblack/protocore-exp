[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protocore"
version = "2.0.0a22"
description = "Protocol-first pure core for LLM agent orchestration"
readme = "README.en.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aleksandr Tikhonov" }]
keywords = ["agent", "llm", "react", "runtime", "orchestration", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typing-extensions>=4.12",
    # Jinja2 prompt template rendering.
    # ``SandboxedEnvironment`` + ``StrictUndefined`` are the hard requirements.
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
# What a host installs to run ``protocore.conformance`` against its own
# adapters. Deliberately narrow: the suites need a test runner and nothing else,
# so a host does not inherit the core's linting and typing toolchain to use them.
testing = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "mypy>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/anchor-inference/protocore"
Source = "https://github.com/anchor-inference/protocore"
Issues = "https://github.com/anchor-inference/protocore/issues"

[tool.hatch.build.targets.sdist]
# An allowlist, not an exclude list. A source archive that opts out by name
# has to name the thing it is hiding, and that name then ships inside the
# archive. Naming only what belongs keeps local working files out without
# announcing that any exist.
include = [
    "protocore",
    "tests",
    "docs",
    ".github",
    "README.md",
    "README.en.md",
    "LICENSE",
    "NOTICE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "CHANGELOG.md",
    "pyproject.toml",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["protocore"]
# Ship bundled Jinja2 templates inside the wheel so
# ``JinjaPromptTemplateProvider`` resolves them via
# ``importlib.resources`` at runtime even when installed as a wheel.
include = ["protocore/prompts/templates/*.j2"]

[tool.hatch.build.targets.wheel.force-include]
"protocore/py.typed" = "protocore/py.typed"
"LICENSE" = "protocore/LICENSE"
"NOTICE" = "protocore/NOTICE"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = false
files = ["protocore", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
# Tests use programmable mocks + heterogeneous unions; strict narrowing
# would require hundreds of per-call asserts without surfacing real bugs.
disable_error_code = [
    "union-attr",
    "attr-defined",
    "unused-ignore",
    "no-untyped-def",
    "no-untyped-call",
    "arg-type",
    "call-arg",
    "list-item",
    "operator",
    "comparison-overlap",
    "index",
    "assignment",
    "return-value",
    "type-arg",
    "dict-item",
    "misc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "B017"]

[tool.coverage.run]
source = ["protocore"]
branch = true

[tool.coverage.report]
exclude_also = [
    # Protocol method stubs (single `...` line bodies)
    '^\s*\.\.\.\s*$',
    # @overload decorators (typing.overload + bare overload)
    '^\s*@(typing\.)?overload',
    # Standard sentinel patterns
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
omit = ["*/__init__.py"]

[tool.bandit.assert_used]
# The conformance package is a pytest suite that ships inside the wheel, so it
# is scanned along with the rest of the package. Its body is assertions — that
# is what a suite is — and B101's warning is about production code compiled with
# -O, not about a test. Every other check still applies to those files.
skips = ["*/conformance/*.py"]
